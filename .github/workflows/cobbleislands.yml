name: CobbleIslands

on:
  push:
    branches: [main]
    paths: ["cobbleislands/**", ".github/workflows/cobbleislands.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cobbleislands
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12.1"
      - name: Compilation
        run: gradle build --no-daemon --stacktrace
        working-directory: cobbleislands
      - name: Publication dans le modpack
        run: python3 tools/publish_mod.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builds mods index.toml pack.toml
          git diff --cached --quiet && exit 0
          git commit -m "CobbleIslands : nouvelle version compilée [skip ci]"
          git pull --rebase origin main
          git push
